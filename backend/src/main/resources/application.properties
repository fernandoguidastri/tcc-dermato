# =====================================================================
# Configuracao base. No Render, os valores vem de VARIAVEIS DE AMBIENTE.
# Localmente, os padroes abaixo valem, e a senha do seu MySQL fica em
# application-local.properties (arquivo ignorado pelo Git).
# =====================================================================

# ===== Banco MySQL =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dermato_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Cria/atualiza as tabelas automaticamente a partir das entidades (ideal para o prototipo)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== Upload de imagens =====
dermato.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== Microservico de IA (Python/FastAPI) =====
dermato.ai-service-url=${AI_SERVICE_URL:http://localhost:8000/predict}

# ===== Seguranca (JWT) =====
dermato.jwt-secret=${JWT_SECRET:chave-local-de-desenvolvimento-troque-em-producao-0123456789}

# ===== Servidor (o Render informa a porta pela variavel PORT) =====
server.port=${PORT:8080}

# ===== Configuracoes locais (senha do MySQL etc.) - nao vai para o Git =====
spring.config.import=optional:classpath:application-local.properties
